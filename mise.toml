[tools]
node = "26"
pnpm = "12.7.0"

[settings]
lockfile = true

[tasks.install]
run = "pnpm install --frozen-lockfile"

[tasks.check]
depends = ["install"]
run = ["pnpm format:check", "pnpm check"]

[tasks.sync]
run = "node scripts/sync-heron.ts"

[tasks."verify:release"]
run = "node scripts/sync-heron.ts --check"
